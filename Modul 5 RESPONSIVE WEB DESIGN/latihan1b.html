<!DOCTYPE html>
<html>
<head>
    <title>Media Query CSS3</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .logo-uns {
            display: none;
        }

        @media only screen and (min-width: 1025px) {
            .logo-uns {
                display: block;
            }
        }
    </style>
</head>

<body>

    <h3>Menggunakan Media Query CSS3</h3>

    <div class="logo-uns">
        <img src="UNS.png" alt="Logo UNS" width="200">
    </div>

</body>
</html>
