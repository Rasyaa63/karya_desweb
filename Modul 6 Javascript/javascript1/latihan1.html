<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { width: 300px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        input, select, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        #hasil { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Sederhana</h2>
    <input type="number" id="num1" placeholder="Masukkan Angka Pertama">
    <input type="number" id="num2" placeholder="Masukkan Angka Kedua">
    
    <button onclick="hitung('+')">Jumlah (+)</button>
    <button onclick="hitung('-')">Kurang (-)</button>
    <button onclick="hitung('*')">Kali (*)</button>
    <button onclick="hitung('/')">Bagi (/)</button>

    <div id="hasil">Hasil: -</div>
</div>

<script>
    function hitung(operator) {
        var val1 = parseFloat(document.getElementById('num1').value);
        var val2 = parseFloat(document.getElementById('num2').value);
        var hasilElemen = document.getElementById('hasil');

        if (isNaN(val1) || isNaN(val2)) {
            hasilElemen.innerHTML = "Hasil: Masukkan kedua angka!";
            return;
        }

        var hasil = 0;
        switch (operator) {
            case '+': hasil = val1 + val2; break;
            case '-': hasil = val1 - val2; break;
            case '*': hasil = val1 * val2; break;
            case '/': 
                hasil = val2 !== 0 ? (val1 / val2) : "Tidak dapat dibagi dengan 0"; 
                break;
        }

        hasilElemen.innerHTML = "Hasil: " + hasil;
    }
</script>

</body>
</html>
